name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']

    steps:
      # The capture engine is vendored in the repo, so a plain checkout has
      # everything; the tests make no network calls and launch no browser.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  shellcheck:
    name: runner.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the parse errors that only show up when someone actually runs
      # the guided runner, which no unit test covers.
      - run: bash -n runner.sh

      - name: runner.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/runner.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'runner.ps1 parses cleanly'
