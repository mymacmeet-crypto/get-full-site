<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Web Archiver</title>
	<style>
		:root {
			--bg: #1d1d20;
			--surface: #26262b;
			--line: #34343a;
			--text: #eee;
			--muted: #9aa0a6;
			--accent: #3b82f6;
			--accent-hover: #2563eb;
			--danger: #f28b82;
			--ok: #81c995;
		}

		body {
			font: 13px/1.5 system-ui, sans-serif;
			width: 380px;
			margin: 0;
			padding: 0;
			background: var(--bg);
			color: var(--text);
		}

		section {
			padding: 10px 12px;
			border-bottom: 1px solid var(--line);
		}

		section:last-of-type {
			border-bottom: 0;
		}

		/* ---- header ---------------------------------------------------- */

		header {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 10px 12px;
			border-bottom: 1px solid var(--line);
		}

		header img {
			width: 18px;
			height: 18px;
		}

		header h1 {
			font-size: 13px;
			font-weight: 600;
			margin: 0;
			flex: 1;
		}

		/* ---- the folder warning, in place of the setup page that used to
		       open itself on every browser start ---------------------------- */

		#folderWarning {
			display: none;
			gap: 8px;
			align-items: center;
			background: #3a2a1c;
			color: #fdd663;
			border-bottom: 1px solid var(--line);
			padding: 9px 12px;
		}

		#folderWarning.visible {
			display: flex;
		}

		#folderWarning span {
			flex: 1;
		}

		#chooseFolderButton {
			font: inherit;
			font-weight: 600;
			flex: none;
			background: #fdd663;
			color: #3a2a1c;
			border: 0;
			border-radius: 6px;
			padding: 4px 9px;
			cursor: pointer;
		}

		#chooseFolderButton:hover {
			background: #fce293;
		}

		/* ---- switch and segmented controls ------------------------------ */

		.switch {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		#powerButton {
			font: inherit;
			font-weight: 600;
			border: 0;
			border-radius: 6px;
			padding: 5px 12px;
			cursor: pointer;
			min-width: 62px;
		}

		#powerButton[data-state="running"] {
			background: #3c2326;
			color: var(--danger);
		}

		#powerButton[data-state="running"]:hover {
			background: #4a2b2f;
		}

		#powerButton[data-state="stopped"] {
			background: #1e3a29;
			color: var(--ok);
		}

		#powerButton[data-state="stopped"]:hover {
			background: #264a34;
		}

		#powerButton:disabled {
			opacity: .6;
			cursor: default;
		}

		#powerStatus {
			flex: 1;
			font-size: 12px;
			color: var(--muted);
		}

		#powerStatus strong {
			color: var(--text);
			font-weight: 600;
		}

		.row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: 9px;
		}

		.row > label {
			width: 52px;
			color: var(--muted);
			font-size: 12px;
		}

		.segmented {
			display: flex;
			flex: 1;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 6px;
			overflow: hidden;
		}

		.segmented button {
			flex: 1;
			font: inherit;
			background: transparent;
			color: var(--muted);
			border: 0;
			padding: 4px 0;
			cursor: pointer;
		}

		.segmented button:hover:not([aria-pressed="true"]) {
			background: #2f2f35;
			color: var(--text);
		}

		.segmented button[aria-pressed="true"] {
			background: var(--accent);
			color: #fff;
			font-weight: 600;
		}

		.segmented button:disabled {
			cursor: default;
			opacity: .5;
		}

		#modeHint {
			margin: 7px 0 0;
			font-size: 11px;
			color: var(--muted);
		}

		/* ---- the open-tab list ------------------------------------------ */

		#listHeader {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 9px 12px 5px;
			font-size: 12px;
			color: var(--muted);
		}

		#selectAll {
			font: inherit;
			background: none;
			border: 0;
			color: #8ab4f8;
			cursor: pointer;
			padding: 0;
		}

		ul {
			list-style: none;
			margin: 0;
			padding: 0 0 4px;
			max-height: 260px;
			overflow-y: auto;
		}

		li {
			display: flex;
			gap: 8px;
			align-items: flex-start;
			padding: 5px 12px;
			cursor: pointer;
		}

		li:hover {
			background: var(--surface);
		}

		li input {
			margin: 3px 0 0;
			accent-color: var(--accent);
			flex: none;
		}

		li .body {
			flex: 1;
			min-width: 0;
		}

		li .title {
			display: block;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		li .url {
			display: block;
			color: var(--muted);
			font-size: 11px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		li .status {
			flex: none;
			font-size: 11px;
			color: var(--muted);
			white-space: nowrap;
			padding-top: 1px;
		}

		li .status[data-status="DOWNLOADED"] {
			color: var(--ok);
		}

		li .status[data-status="FAILED"] {
			color: var(--danger);
		}

		li.empty {
			color: var(--muted);
			cursor: default;
			padding: 14px 12px;
		}

		li.empty:hover {
			background: none;
		}

		/* ---- actions ----------------------------------------------------- */

		.actions {
			display: flex;
			gap: 8px;
			padding: 9px 12px;
			border-top: 1px solid var(--line);
		}

		.actions button {
			font: inherit;
			border: 0;
			border-radius: 6px;
			padding: 6px 10px;
			cursor: pointer;
		}

		#downloadButton {
			flex: 1;
			background: var(--accent);
			color: #fff;
			font-weight: 600;
		}

		#downloadButton:hover:not(:disabled) {
			background: var(--accent-hover);
		}

		#saveNowButton {
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--line);
		}

		#saveNowButton:hover:not(:disabled) {
			background: #2f2f35;
		}

		.actions button:disabled {
			background: #3c4043;
			color: #888;
			border-color: transparent;
			cursor: default;
		}

		footer {
			padding: 7px 12px 9px;
			border-top: 1px solid var(--line);
			font-size: 12px;
			color: var(--muted);
		}

		footer a {
			color: #8ab4f8;
			cursor: pointer;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<header>
		<img src="../resources/icon_32.png" alt="">
		<h1>Web Archiver</h1>
	</header>

	<div id="folderWarning">
		<span>No archive folder connected — nothing is being saved.</span>
		<button id="chooseFolderButton">Choose folder…</button>
	</div>

	<section>
		<div class="switch">
			<button id="powerButton" data-state="running" disabled>…</button>
			<span id="powerStatus">Checking…</span>
		</div>
		<div class="row">
			<label id="modeLabel">Mode</label>
			<div class="segmented" role="group" aria-labelledby="modeLabel">
				<button data-setting="mode" data-value="auto" aria-pressed="false">Auto</button>
				<button data-setting="mode" data-value="manual" aria-pressed="false">Manual</button>
			</div>
		</div>
		<div class="row">
			<label id="formatLabel">Format</label>
			<div class="segmented" role="group" aria-labelledby="formatLabel">
				<button data-setting="format" data-value="html" aria-pressed="false">HTML</button>
				<button data-setting="format" data-value="md" aria-pressed="false">MD</button>
				<button data-setting="format" data-value="both" aria-pressed="false">Both</button>
			</div>
		</div>
		<p id="modeHint"></p>
	</section>

	<div id="listHeader">
		<span id="listCount">Open tabs</span>
		<button id="selectAll">Select all</button>
	</div>
	<ul id="tabList">
		<li class="empty">Loading…</li>
	</ul>

	<div class="actions">
		<button id="downloadButton" disabled>Download selected</button>
		<button id="saveNowButton">Save this page</button>
	</div>

	<footer><a id="setupLink">Setup &amp; session log</a> &nbsp;·&nbsp; <a id="healthLink">Health</a></footer>

	<script type="module" src="../bg/ui-archive-popup.js"></script>
</body>

</html>
